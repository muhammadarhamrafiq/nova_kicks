services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    develop:
      watch:
      - action: sync
        path: ./backend
        target: /app
        ignore:
          - .venv
      - action: rebuild
        path: ./backend/Dockerfile.dev

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
